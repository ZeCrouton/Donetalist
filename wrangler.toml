name = "donetalist"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# Le front (dossier public/) est servi gratuitement, sans compter dans les requêtes Worker.
# Seules les routes /api/* passent par le Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "donetalist"
database_id = "REMPLACER_PAR_VOTRE_ID"

# Purge quotidienne (3 h UTC) : listes sans activité depuis 18 mois, compteurs périmés.
[triggers]
crons = ["0 3 * * *"]
